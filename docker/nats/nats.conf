# NATS Server configuration for SCG deployment

# Standard NATS client port
port: 4222

# HTTP monitoring endpoint (used by healthcheck)
http_port: 8222

# WebSocket support — nginx proxies /nats → here
# The GUI connects via ws://host/nats which nginx forwards to ws://nats:4223
websocket {
  port:   4223
  no_tls: true
}
