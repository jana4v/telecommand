server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime palette assets: files dropped into the mounted volume (see
    # compose.yml) appear in the Elements palette without an image rebuild.
    # The client fetches the directory with Accept: application/json and
    # expects nginx's JSON autoindex listing ([{"name","type",...}]).
    # Must precede the regex location below, which would otherwise capture
    # .svg/.png requests and serve them from the bundle root instead.
    location ^~ /spasdacs/palette-images/ {
        alias /palette-images/;
        autoindex on;
        autoindex_format json;
    }

    # SPASDACS uses hash-based routing (createWebHashHistory), so the server
    # only ever sees /spasdacs/ or /spasdacs/index.html as the request path —
    # in-app routes live entirely in the URL fragment, which never reaches
    # the server. This fallback covers a direct hit or a page refresh.
    location /spasdacs/ {
        try_files $uri $uri/ /spasdacs/index.html;
    }

    location ~* ^/spasdacs/.*\.(js|css|woff2?|ttf|eot|svg|png|jpg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
