server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large file uploads (TM database files, procedure uploads)
    client_max_body_size 200m;

    # Timeouts for long-running API requests
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Common proxy headers (applied in all location blocks via include)
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # -------------------------------------------------------------------------
    # NATS WebSocket  — must be before the /nats static fallback
    # -------------------------------------------------------------------------
    location /nats {
        proxy_pass         http://nats:4223;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_read_timeout 3600s;
    }

    # -------------------------------------------------------------------------
    # Go Gateway  — all /api/go/v1/** and /api/v2/tm/**
    # The gateway also internally proxies /api/go/v1/sim/** to ingest.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://gateway:21000;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # -------------------------------------------------------------------------
    # Simulator direct API  (/simulator/api/go/v1/**)
    # -------------------------------------------------------------------------
    location /simulator/ {
        proxy_pass http://simulator:21001;
    }

    # -------------------------------------------------------------------------
    # IAM service  (/iam/** and /iam/api/v1/**)
    # -------------------------------------------------------------------------
    location /iam/ {
        proxy_pass http://iam:21005;
    }

    # -------------------------------------------------------------------------
    # UMACS-TC service  (/umacs/**)
    # -------------------------------------------------------------------------
    location /umacs/ {
        proxy_pass http://umacs-tc:21002;
    }

    # -------------------------------------------------------------------------
    # Remaining REST endpoints proxied via gateway
    # -------------------------------------------------------------------------
    location /restApi/ {
        proxy_pass http://gateway:21000;
    }

    # -------------------------------------------------------------------------
    # Nuxt SPA — serve index.html for all unmatched paths (client-side routing)
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive caching for hashed JS/CSS assets
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
